
name: Build and Publish Portfolio Docker Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Version tag for the Docker image"
        required: true
        type: string
        default: "1.0.0"

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout portfolio source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/fatma-devops-portfolio:${{ inputs.image_tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/fatma-devops-portfolio:latest
