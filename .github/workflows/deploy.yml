
name: Deploy Portfolio Locally

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Docker Hub image version to deploy
        required: true
        type: string
        default: "1.0.0"

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Portfolio on Windows
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10

    steps:
      - name: Checkout portfolio repository
        uses: actions/checkout@v4

      - name: Verify Docker Desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          docker version
          if ($LASTEXITCODE -ne 0) {
            throw "Docker Engine is unavailable."
          }

          docker compose version
          if ($LASTEXITCODE -ne 0) {
            throw "Docker Compose is unavailable."
          }

      - name: Validate image version
        shell: pwsh
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if ($env:IMAGE_TAG -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Invalid image tag. Use semantic versioning, for example 1.0.0."
          }

          Write-Host "Image version: $env:IMAGE_TAG"

      - name: Pull published Docker Hub image
        shell: pwsh
        env:
          PORTFOLIO_IMAGE: fatmadhouib/fatma-devops-portfolio:${{ inputs.image_tag }}
        run: |
          $ErrorActionPreference = "Stop"

          docker compose -p fatma-portfolio -f docker-compose.yml pull portfolio

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to pull the Docker Hub image."
          }

      - name: Deploy portfolio with Docker Compose
        shell: pwsh
        env:
          PORTFOLIO_IMAGE: fatmadhouib/fatma-devops-portfolio:${{ inputs.image_tag }}
        run: |
          $ErrorActionPreference = "Stop"

          docker compose -p fatma-portfolio -f docker-compose.yml up -d --no-build

          if ($LASTEXITCODE -ne 0) {
            throw "Docker Compose deployment failed."
          }

          docker compose -p fatma-portfolio -f docker-compose.yml ps

      - name: Verify container health and HTTP response
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $deadline = (Get-Date).AddMinutes(3)
          $healthy = $false

          Write-Host "Waiting for the portfolio container to become healthy..."

          do {
            $health = (
              docker inspect --format '{{.State.Health.Status}}' fatma-devops-portfolio 2>$null |
              Out-String
            ).Trim()

            Write-Host "Container health: $health"

            if ($health -eq "healthy") {
              try {
                $response = Invoke-WebRequest `
                  -Uri "http://localhost:3000" `
                  -UseBasicParsing `
                  -TimeoutSec 10

                if ($response.StatusCode -eq 200) {
                  $healthy = $true
                  break
                }
              }
              catch {
                Write-Host "HTTP endpoint is not ready yet."
              }
            }

            Start-Sleep -Seconds 5
          }
          while ((Get-Date) -lt $deadline)

          if (-not $healthy) {
            docker compose -p fatma-portfolio -f docker-compose.yml logs --tail 100
            throw "Portfolio deployment failed its health checks."
          }

          Write-Host "Portfolio deployment successful."
          Write-Host "Application URL: http://localhost:3000"
