
services:
  portfolio:
    container_name: fatma-devops-portfolio
    image: ${PORTFOLIO_IMAGE:-fatmadhouib/fatma-devops-portfolio:latest}
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
